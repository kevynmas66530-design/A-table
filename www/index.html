<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6B55">
<title>À table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with an oversized week range, one scrolling column (day cards in a wrapping grid), fixed bottom tabs. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5B6862; --line:#D7DFD9;
  --accent:#1B6B55; --accent-ink:#FFFFFF; --soft:#DFEEE7; --hi:#F0C94A; --hi-ink:#3A2E00;
  --good:#1E7F4F; --warn:#9A6A00; --bad:#B23A2B; --bad-soft:#F7E1DD; --warn-soft:#F8EBC8;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 0 rgba(22,33,28,.04),0 8px 24px -12px rgba(22,33,28,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --ink:#E7EEE9; --muted:#97A59E; --line:#25332C;
  --accent:#5EC3A1; --accent-ink:#08170F; --soft:#1B2E26; --hi:#E6C558; --hi-ink:#241B00;
  --good:#5FD08F; --warn:#E6C558; --bad:#F08A78; --bad-soft:#35201C; --warn-soft:#352B10;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --ink:#E7EEE9; --muted:#97A59E; --line:#25332C;
  --accent:#5EC3A1; --accent-ink:#08170F; --soft:#1B2E26; --hi:#E6C558; --hi-ink:#241B00;
  --good:#5FD08F; --warn:#E6C558; --bad:#F08A78; --bad-soft:#35201C; --warn-soft:#352B10;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{max-width:1040px;margin-inline:auto;padding-inline:16px;padding-block:14px 104px}
.top{display:flex;flex-direction:column;gap:2px;padding-block:6px 14px}
.brand{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.brand b{font:800 15px/1 var(--f-display);letter-spacing:0;text-transform:none;color:var(--accent)}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav h1{font:800 clamp(28px,7.5vw,44px)/1.02 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr;gap:14px;box-shadow:var(--shadow)}
@media(min-width:720px){.sum{grid-template-columns:1.2fr 1fr;align-items:end}}
.big{font:800 clamp(30px,8vw,42px)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.hi{background:var(--hi);color:var(--hi-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.notice{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.notice.bad{background:var(--bad-soft)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.day{padding:0;overflow:hidden}
.day h3{margin:0;padding:12px 16px;font:800 17px/1.2 var(--f-display);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);text-transform:capitalize}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .lab{grid-column:1/-1;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot-main{background:none;border:0;padding:4px 0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot-main .rname{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.slot-main .rmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:4px}
.tools .icon-btn{width:34px;height:34px;border-radius:8px}
.tools .icon-btn svg{width:16px;height:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:1040px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{box-shadow:inset 0 -3px 0 var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.x[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:2ch;text-align:center;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rcard:hover{border-color:var(--accent)}
.rcard .rname{font-weight:600;overflow-wrap:anywhere}
.rcard .rmeta{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.aisle{margin:6px 0 0;font:800 18px/1.2 var(--f-display)}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.gitem .nm{font-weight:600;overflow-wrap:anywhere}
.gitem.done .nm{text-decoration:line-through;color:var(--muted)}
.gitem.home{opacity:.62}
.gitem .sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;min-height:46px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt b{white-space:nowrap;color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .bk{position:absolute;inset:0;background:rgba(8,14,11,.55)}
#sheet .pn{position:relative;width:min(100%,640px);max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:720px){#sheet{align-items:center}#sheet .pn{border-radius:18px;max-height:84%}}
.pn h2{font:800 24px/1.15 var(--f-display);margin:2px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.pn h4{margin:18px 0 6px;font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pn ol,.pn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nutri div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.nutri b{display:block;font:800 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.nutri span{font-size:11.5px;color:var(--muted)}
.close{position:sticky;top:0;float:right;margin:-6px -4px 0 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font:800 24px/1.15 var(--f-display);margin:0}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease}}

.sub-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.alts{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;padding:4px 0 2px 54px}
.altbtn{background:var(--soft);border:0;border-radius:8px;padding:6px 10px;text-align:left;font-size:13px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.altbtn b{color:var(--accent)}
.aibtn{width:100%;justify-content:flex-start;border-style:dashed;color:var(--accent)}
.aibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.chartbox .ax{fill:var(--muted);font:500 11px var(--f-body)}
.chartbox .lab{fill:var(--ink);font:700 12px var(--f-body)}
.chartbox .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chartbox .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chartbox .goal{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chartbox .xh{stroke:var(--muted);stroke-width:1}
.chartbox .hit{fill:transparent;cursor:pointer;outline:none}
.chartbox .hit:focus-visible{fill:var(--soft);opacity:.5}
.ttip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.r{text-align:right}

.thumb{grid-row:1/3;grid-column:1;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px;line-height:1;letter-spacing:-2px;background:var(--soft);align-self:center}
.thumb.b{background:var(--warn-soft)}.thumb.s{background:var(--bad-soft)}
.slot-main{display:grid!important;grid-template-columns:44px minmax(0,1fr);column-gap:10px;row-gap:2px;align-items:center}
.slot-main .rname{grid-column:2;grid-row:1;align-self:end}.slot-main .rmeta{grid-column:2;grid-row:2;align-self:start}
.banner{font-size:38px;line-height:1;letter-spacing:4px;text-align:center;padding:18px 10px;border-radius:14px;background:var(--soft);margin:6px 0 10px;overflow:hidden}
.banner.b{background:var(--warn-soft)}.banner.s{background:var(--bad-soft)}

#timers{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:26;display:flex;flex-direction:column;gap:6px;max-width:520px;margin-inline:auto}
body.cooking #timers{bottom:auto;top:calc(68px + env(safe-area-inset-top,0px))}
body.cooking:has(#timers:not([hidden])) .ck-top{margin-bottom:62px}
.tm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;font-weight:600;box-shadow:var(--shadow)}
.tm b{font:800 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tm.done{background:var(--hi);color:var(--hi-ink)}
.tm .icon-btn{background:transparent;border-color:transparent;color:inherit;width:36px;height:36px}
#cook{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.ck-in{width:min(100%,640px);margin-inline:auto;flex:1;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));gap:16px}
.ck-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ck-dots{display:flex;gap:6px;flex-wrap:wrap}
.ck-dots i{width:22px;height:6px;border-radius:99px;background:var(--line)}
.ck-dots i.on{background:var(--accent)}
.ck-step{font:600 clamp(22px,6.2vw,30px)/1.35 var(--f-body);text-wrap:pretty;flex:1}
.ck-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.ck-nav .btn{min-height:56px;font-size:17px}
.ck-ing{display:flex;flex-direction:column;gap:2px;font-size:18px}
.ck-ing label{display:flex;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.ck-ing input{width:22px;height:22px;accent-color:var(--accent)}
.ck-ing input:checked+span{text-decoration:line-through;color:var(--muted)}
.ck-t{display:flex;gap:8px;flex-wrap:wrap}
.ck-t .btn{min-height:50px;font-size:16px}

.thumb{font-size:0}
.thumb svg,.thumb img,.rpic svg,.rpic img{width:100%;height:100%;display:block;border-radius:12px;object-fit:cover}
.rcard{grid-template-columns:48px minmax(0,1fr) auto!important;align-items:center}
.rpic{grid-row:1/3;width:48px;height:48px;border-radius:12px;background:var(--soft);display:block}
.rpic.b{background:var(--warn-soft)}.rpic.s{background:var(--bad-soft)}
.rcard .rmeta{grid-column:2/-1!important}
.hero{height:210px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden;margin:6px 0 10px}
.hero.b{background:var(--warn-soft)}.hero.s{background:var(--bad-soft)}
.hero svg{width:190px;height:190px}
.hero img.big{width:100%;height:100%;object-fit:cover;border-radius:0}
label.btn input[hidden]{display:none}
.ob-h{margin:0;font:800 24px/1.15 var(--f-display);text-wrap:balance}

.shell{padding-top:calc(14px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand"><b>À table</b><span>Carnet de menus</span></div>
    <div class="weeknav" id="weeknav"></div>
  </header>
  <main id="view" aria-live="polite"><div class="empty muted">Ouverture du carnet…</div></main>
</div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheet" hidden><div class="bk" data-act="close"></div><div class="pn" role="dialog" aria-modal="true" id="pn"></div></div>
<div id="toast" role="status" hidden></div>
<div id="timers" hidden aria-live="polite"></div>
<div id="cook" hidden role="dialog" aria-modal="true" aria-label="Mode cuisine"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=n=>Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const dayLabel=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- catalogue ---------- */
// [nom, unité, rayon, prix (€/kg, €/L ou €/pièce), conditionnement, kcal, prot, gluc, lip (pour 100 g/ml), drapeaux, g/pièce]
// drapeaux : m viande, r viande rouge, f poisson, d laitier, e œuf, g gluten
const A={b:'Boucherie et poissons',f:'Frais',e:'Épicerie',v:'Fruits et légumes'};
const RAW={
poulet:['Filet de poulet','g',A.b,13,300,120,23,0,2.5,'m'],dinde:['Escalope de dinde','g',A.b,14,300,110,24,0,1.5,'m'],
boeuf:['Bœuf haché 5 %','g',A.b,16,350,130,21,0,5,'mr'],jambon:['Jambon blanc','g',A.b,11,200,110,19,1,3.5,'m'],
saumon:['Pavé de saumon','g',A.b,23,250,200,20,0,13,'f'],cabillaud:['Cabillaud','g',A.b,18,250,85,18,0,.7,'f'],
colin:['Colin','g',A.b,11,250,85,18,0,.8,'f'],crevette:['Crevettes décortiquées','g',A.b,22,200,85,18,0,1,'f'],

function chartSvg(pts,unit,goal){
  const W=360,H=230,L=36,R=58,T=16,Bm=28,pw=W-L-R,ph=H-T-Bm;
  const vals=pts.map(x=>x.v);if(goal!=null)vals.push(goal);
  let lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);if(hi-lo<3){const m=(hi+lo)/2;lo=Math.floor(m-1.5);hi=lo+3}
  const t0=parse(pts[0].d).getTime(),t1=parse(pts[pts.length-1].d).getTime();
  const X=d=>pts.length<2||t1===t0?L+pw/2:L+(parse(d).getTime()-t0)/(t1-t0)*pw,Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  const f=v=>nf(v,Number.isInteger(v)?0:1);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${f(v)}</text>`}
  const xs=[0];if(pts.length>2)xs.push(Math.floor((pts.length-1)/2));if(pts.length>1)xs.push(pts.length-1);
  g+=[...new Set(xs)].map((i,j,a)=>`<text class="ax" x="${X(pts[i].d)}" y="${H-8}" text-anchor="${a.length>1&&j===0?'start':j===a.length-1&&a.length>1?'end':'middle'}">${shortDate(pts[i].d)}</text>`).join('');
  if(goal!=null)g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}"/><text class="ax" x="${W-R+6}" y="${Y(goal)+4}">objectif</text>`;
  const path=pts.map((x,i)=>(i?'L':'M')+X(x.d).toFixed(1)+' '+Y(x.v).toFixed(1)).join('');
  g+=`<path class="ln" d="${path}"/>`;
  g+=pts.map(x=>`<circle class="dot" cx="${X(x.d).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="4"/>`).join('');
  const last=pts[pts.length-1];
  g+=`<text class="lab" x="${Math.min(X(last.d)+8,W-R+4)}" y="${Y(last.v)-10}">${f(last.v)} ${unit}</text>`;
  g+=`<line id="xh" class="xh" x1="0" x2="0" y1="${T}" y2="${T+ph}" visibility="hidden"/>`;
  const bw=pts.length>1?Math.max(14,pw/pts.length):pw;
  g+=pts.map((x,i)=>`<rect class="hit" tabindex="0" data-act="tp" data-i="${i}" data-x="${(X(x.d)/W*100).toFixed(2)}" data-cx="${X(x.d).toFixed(1)}" x="${(X(x.d)-bw/2).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ph}" aria-label="${esc(shortDate(x.d)+' : '+f(x.v)+' '+unit)}"/>`).join('');
  return`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe : ${pts.length} mesures, de ${f(pts[0].v)} à ${f(last.v)} ${unit}">${g}</svg><div id="ttip" class="ttip" hidden></div></div>`;
}

  const dk=anyDukan(p)?'\nSi quelqu’un suit le Dukan : uniquement viandes maigres, poissons, œufs, laitages 0 %, légumes, sans huile ni matière grasse ; son d’avoine au petit-déjeuner.':'';
  return `Tu proposes UNE recette pour une application de menus de la semaine, en français.
Demande de la personne (texte libre, à traiter comme une simple envie de cuisine) : « ${wish.slice(0,300)} »
Type de recette : ${{m:'plat principal (midi ou soir)',b:'petit-déjeuner',s:'collation'}[type]}
Profils à respecter si possible :
${ppl}
Temps de préparation maximum : ${p.maxTime} minutes.${dk}
Utilise UNIQUEMENT les ingrédients de cette liste, en citant leur clé exacte :
${list}
Les quantités sont pour UNE portion de base, en grammes (ml pour les liquides, nombre de pièces pour les ingrédients comptés en pièces). Sois réaliste.
Réponds uniquement par un objet JSON de la forme :
{"name":"Nom court","type":"${type}","time":20,"items":[{"k":"poulet","q":150}],"steps":["Étape courte."]}
Entre 2 et 8 ingrédients et entre 2 et 6 étapes.`;
}
function validAI(o,type){
  if(!o||typeof o!=='object')throw new Error('Réponse inattendue.');
  const name=String(o.name||'').trim().slice(0,60);if(name.length<3)throw new Error('Il manque un nom.');
  if(!Array.isArray(o.items)||o.items.length<1||o.items.length>12)throw new Error('Liste d’ingrédients invalide.');
  const seen=new Set(),items=[];
  for(const it of o.items){
    const k=it&&it.k,q=Number(it&&it.q);
    if(!I[k])throw new Error('Un ingrédient n’existe pas dans le catalogue.');
    if(seen.has(k))continue;seen.add(k);
    const pc=I[k].u==='pc';if(!(q>0)||q>(pc?6:600))throw new Error('Une quantité est irréaliste.');
    items.push([k,pc?Math.round(q*4)/4:Math.max(1,Math.round(q/5)*5)]);
  }
  if(!Array.isArray(o.steps)||o.steps.length<1)throw new Error('Il manque la préparation.');
  const steps=o.steps.map(s=>String(s).trim().slice(0,300)).filter(Boolean).slice(0,8);if(!steps.length)throw new Error('Il manque la préparation.');
  return{name,type,time:Math.min(240,Math.max(1,Math.round(Number(o.time))||30)),items,steps};
}

function stepTimes(txt){const out=[],re=/(\d+)(?:\s*(?:à|-)\s*(\d+))?\s*(minutes?|min\b|heures?|h\b)/gi;let m;while((m=re.exec(txt))){let n=Number(m[2]||m[1]);if(/^h/i.test(m[3]))n*=60;if(n>=1&&n<=240)out.push(n)}return[...new Set(out)]}
function ring(t){
  toast('Minuteur terminé : '+t.label);

function startTimer(min,label){timers.push({id:++tid,label,end:Date.now()+min*60000,done:false});if(!tick)tick=setInterval(tickT,1000);tsig='';tickT()}
function tickT(){
  const now=Date.now(),el=$('#timers');
  for(const t of timers)if(!t.done&&t.end<=now){t.done=true;ring(t)}
  if(!timers.length){el.hidden=true;clearInterval(tick);tick=null;tsig='';return}
  const sig=timers.map(t=>t.id+(t.done?'d':'')).join();
  if(sig!==tsig){tsig=sig;el.hidden=false;el.innerHTML=timers.map(t=>`<div class="tm ${t.done?'done':''}" data-tm="${t.id}"><span>⏱ ${esc(t.label)}</span><b class="num"></b><button class="icon-btn" data-act="tmx" data-id="${t.id}" aria-label="Arrêter le minuteur">✕</button></div>`).join('')}

function prepPlan(plan){
  const use={};
  for(const e of plan.entries){if(e.lo)continue;
    for(const{pe,rid}of eaters(e)){const r=BYID[rid],m=mult(pe);
      for(const[k,q]of r.items){let key=k;if(PVEG.has(k))key='veg';else if(k==='oeuf'){if(!/dur|mimosa/i.test(r.name))continue}else if(!PREP[k])continue;
        const u=use[key]||(use[key]={q:0,days:new Set(),ing:new Set()});u.q+=q*m;u.days.add(e.d);u.ing.add(k)}}}
  const days={};

    const keep=PREP[key].keep,ds=[...u.days].sort((a,b)=>a-b);let i=0;
    while(i<ds.length){const start=ds[i],grp=[];while(i<ds.length&&ds[i]<=start+keep-1)grp.push(ds[i++]);
      if(grp.length<2&&key!=='oeuf')continue;

 ckt(el){startTimer(Number(el.dataset.min),el.dataset.label);toast('Minuteur lancé : '+el.dataset.min+' min')},
 tmx(el){timers=timers.filter(t=>t.id!==+el.dataset.id);tsig='';tickT()},
 rate(el){const id=el.dataset.id,v=Number(el.dataset.v);if(S.rate[id]===v)delete S.rate[id];else S.rate[id]=v;commit();if(cook)cookRender();else if(curDetail&&!$('#sheet').hidden)detail(curDetail.rid,curDetail.i)},
 rfav(){recFav=!recFav;render()},

 wk(el){S.week=addDays(S.week,7*Number(el.dataset.n));commit()},
 tip(el){const k=el.dataset.k,p=S.prof;
   if(k==='veg')p.people.forEach(pe=>{if(!['vegetarian','vegan','dukan'].includes(pe.diet))pe.diet='vegetarian'});
   else if(k==='nob')p.meals.b=false;else if(k==='nos')p.meals.s=false;
   else if(k.startsWith('x:')){const ing=k.slice(2);if(I[ing])p.people.forEach(pe=>{if(!pe.excl.includes(ing))pe.excl.push(ing)})}
   generate(S.week);commit();toast(k.startsWith('x:')?'Ingrédient évité, semaine recomposée':'Réglage appliqué, semaine recomposée')},
 cheap(el){const plan=curPlan();setRecipe(plan,+el.dataset.i,el.dataset.id);plan.got=[];plan.tipsDone=false;plan.tips=[];commit();toast('Plat remplacé')},
 genme(){generate(S.week);tab='week';commit();window.scrollTo(0,0);const q=curPlan();toast(q.missing&&q.missing.length?'Certains repas n’ont pas de recette compatible':q.overBudget?'Semaine composée, budget dépassé':'Semaine composée')},
 gen(){if(!S.onboarded){ACT.onbstart();return}generate(S.week);commit();const p=curPlan();toast(p.missing&&p.missing.length?'Certains repas n’ont pas de recette compatible':p.overBudget?'Semaine composée, budget dépassé':'Semaine composée')},
 lock(el){const e=curPlan().entries[+el.dataset.i];e.lock=!e.lock;commit()},
 swap(el){swap(+el.dataset.i)},
 pick(el){picker(+el.dataset.i)},
 use(el){const plan=curPlan();setRecipe(plan,+el.dataset.i,el.dataset.id);plan.got=[];plan.tipsDone=false;plan.tips=[];closeSheet();commit()},
 open(el){detail(curPlan().entries[+el.dataset.i].r,+el.dataset.i)},
 openalt(el){detail(el.dataset.id,+el.dataset.i)},
 rec(el){detail(el.dataset.id)},
 close(){closeSheet()},
 rtype(el){recType=el.dataset.t;render()},
 rok(){recOnlyOk=!recOnlyOk;render()},
 got(el){const p=curPlan(),s=new Set(p.got||[]);el.checked?s.add(el.dataset.k):s.delete(el.dataset.k);p.got=[...s];S.savedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(flush,600);el.closest('.gitem').classList.toggle('done',el.checked)},
 home(el){const k=el.dataset.k,s=new Set(S.pantry);s.has(k)?s.delete(k):s.add(k);S.pantry=[...s];commit()},
 price(el){const k=el.dataset.k,i=I[k],unit=i.u==='pc'?'pièce':i.u==='ml'?'litre':'kg';
   openSheet(`<h2>${esc(i.n)}</h2><label class="f">Ton prix (€ par ${unit})<input type="number" id="pv" min="0" step="0.01" value="${price(k)}" inputmode="decimal"></label><p class="small muted">Prix indicatif de départ : ${nf(i.pr,2)} € par ${unit}.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="pricesave" data-k="${k}">Enregistrer</button><button class="btn" data-act="pricereset" data-k="${k}">Revenir au prix indicatif</button></div>`)},
 pricesave(el){const v=Number($('#pv').value);if(!isFinite(v)||v<0){toast('Indique un prix valide');return}S.prices[el.dataset.k]=v;closeSheet();commit()},
 pricereset(el){delete S.prices[el.dataset.k];closeSheet();commit()},
 async copylist(){const ok=await copyText(listText());if(ok)toast('Liste copiée')},
 editp(el){editP=+el.dataset.i;render()},
 addp(){const p=S.prof;if(p.people.length>=8)return;p.people.push(newPerson('Personne '+(p.people.length+1)));editP=p.people.length-1;stale();commit()},
 delp(el){const p=S.prof,pe=p.people[editP];if(p.people.length<2)return;
   if(!arm(el,'Confirmer : retirer '+pe.name))return;
   p.people.splice(editP,1);delete S.track[pe.id];editP=0;stale();commit();toast('Personne retirée')},
 exg(el){const pe=S.prof.people[editP],f=el.dataset.f,ks=Object.keys(I).filter(k=>I[k].fl.includes(f)),on=ks.every(k=>pe.excl.includes(k));
   pe.excl=on?pe.excl.filter(k=>!ks.includes(k)):[...new Set([...pe.excl,...ks])];stale();commit()},
 ex(el){const pe=S.prof.people[editP],k=el.dataset.k,e=pe.excl;pe.excl=e.includes(k)?e.filter(x=>x!==k):[...e,k];stale();commit()},
 async export(){const ok=await copyText(JSON.stringify(S));if(ok)toast('Sauvegarde copiée')},
 importform(){openSheet(`<h2>Restaurer une sauvegarde</h2><p class="small muted">Colle ici le texte copié depuis « Copier la sauvegarde ». Il remplacera le carnet actuel.</p><textarea id="imp" placeholder="Colle la sauvegarde"></textarea><div class="row" style="margin-top:12px"><button class="btn primary" data-act="doimport">Restaurer</button></div>`)},
 doimport(){try{const s=normalize(JSON.parse($('#imp').value));S=s;editP=0;trackP=null;closeSheet();commit();toast('Carnet restauré')}catch{toast('Sauvegarde illisible')}},
 newrec(){draft={name:'',type:'m',time:30,items:[],steps:'',pick:'poulet'};recForm()},
 dra(){readDraft();const q=Number($('#d-qty').value);if(!(q>0)){recForm('Indique une quantité pour cet ingrédient.');return}draft.items.push([draft.pick,q]);recForm()},
 dri(el){readDraft();draft.items.splice(+el.dataset.ix,1);recForm()},
 drs(){readDraft();const d=draft;
   if(!d.name.trim()){recForm('Donne un nom à ta recette.');return}
   if(!d.items.length){recForm('Ajoute au moins un ingrédient.');return}
   const steps=d.steps.split('\n').map(s=>s.trim()).filter(Boolean);
   S.custom.push({id:'c'+Date.now().toString(36),custom:true,name:d.name.trim(),type:d.type,time:Math.max(1,Number(d.time)||30),items:d.items,steps:steps.length?steps:['Prépare et assemble les ingrédients.']});
   closeSheet();recType='all';commit();toast('Recette ajoutée')},
 delrec(el){const id=el.dataset.id;
   if(!arm(el,'Confirmer la suppression'))return;
   {const ph=S.photos[id];delete S.photos[id];if(ph&&assetsFn)assetsFn.delete(ph).catch(()=>{})}S.custom=S.custom.filter(r=>r.id!==id);for(const pl of Object.values(S.plans))for(const e of pl.entries){if(e.r===id){e.r=null;delete e.lo;delete e.lock;delete e.alt}if(e.alt)for(const k in e.alt)if(e.alt[k]===id)e.alt[k]=null}
   closeSheet();commit();toast('Recette supprimée')},
 /* semaines gardées */
 favform(){const plan=curPlan();if(!plan||!plan.entries.length)return;
   openSheet(`<h2>Garder cette semaine</h2><label class="f">Nom<input type="text" id="fv-name" maxlength="40" value="${esc('Semaine du '+shortDate(S.week))}"></label><p class="small muted">Tu pourras la reprendre sur n’importe quelle semaine.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="favdo">Garder</button></div>`)},
 favdo(){const plan=curPlan(),name=($('#fv-name').value||'').trim()||'Semaine gardée';
   if(S.favs.length>=20){toast('20 semaines gardées au maximum : supprime-en une');return}
   S.favs.unshift({id:'f'+Date.now().toString(36),name:name.slice(0,40),entries:strip(plan)});closeSheet();commit();toast('Semaine gardée')},
 favs(){favsSheet()},
 favuse(el){const f=S.favs.find(x=>x.id===el.dataset.id);if(!f)return;
   const cur=curPlan();if(cur&&cur.entries.length&&!arm(el,'Confirmer le remplacement'))return;
   adopt(f.entries);closeSheet();tab='week';commit();toast('Semaine reprise')},
 favdel(el){if(!arm(el,'Confirmer'))return;S.favs=S.favs.filter(x=>x.id!==el.dataset.id);S.savedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(flush,600);favsSheet()},
 copyprev(el){const prev=S.plans[addDays(S.week,-7)];if(!prev||!prev.entries.length)return;
   const cur=curPlan();if(cur&&cur.entries.length&&!arm(el,'Confirmer le remplacement'))return;
   adopt(strip(prev));commit();toast('Semaine précédente copiée')},
 /* suivi */
 tpick(el){trackP=el.dataset.id;if(el.dataset.go)tab=el.dataset.go;render();window.scrollTo(0,0)},
 homegen(){if(!S.onboarded){ACT.onbstart();return}generate(S.week);commit();toast('Semaine composée')},
 tmet(el){trackMetric=el.dataset.m;render()},
 tp(el){showTip(el)},
 tadd(){const pe=trackPerson(),d=$('#td').value,w=$('#tw').value===''?null:Number($('#tw').value),c=$('#tc').value===''?null:Number($('#tc').value);
   if(!/^\d{4}-\d\d-\d\d$/.test(d)){toast('Choisis une date');return}
   if(w==null&&c==null){toast('Indique un poids ou un tour de taille');return}
   if(w!=null&&!(w>=20&&w<=400)){toast('Poids entre 20 et 400 kg');return}
   if(c!=null&&!(c>=20&&c<=300)){toast('Tour de taille entre 20 et 300 cm');return}
   const rows=S.track[pe.id]||(S.track[pe.id]=[]),x=rows.find(r=>r.d===d);
   if(x){if(w!=null)x.w=w;if(c!=null)x.c=c}else rows.push({d,w,c});
   rows.sort((a,b)=>a.d.localeCompare(b.d));if(rows.length>500)rows.splice(0,rows.length-500);
   commit();toast('Mesure enregistrée')},
 tdel(el){if(!arm(el,'Confirmer'))return;const pe=trackPerson();S.track[pe.id]=(S.track[pe.id]||[]).filter(r=>r.d!==el.dataset.d);commit()},
 /* recettes Claude */
 aiopen(){ai={wish:'',type:'m',busy:false,result:null,err:''};aiSheet()},
 async aigo(){
   if(!sampleFn||!ai||ai.busy)return;
   const w=$('#ai-wish');if(w){ai.wish=w.value;ai.type=$('#ai-type').value}
   if(ai.wish.trim().length<3){ai.err='Décris ton envie en quelques mots.';aiSheet();return}
   ai.busy=true;ai.err='';aiSheet();const my=ai;
   try{
     const o=await sampleFn.json(aiPrompt(my.wish.trim(),my.type),{cache:false});
     my.result=validAI(o,my.type);
   }catch(e){
     const c=e&&e.code;
     my.result=null;
     if(c==='rate_limited')my.err='Trop de demandes pour le moment. Réessaie un peu plus tard.';
     else if(c==='cancelled')my.err='Demande annulée.';
     else if(c==='invalid_json'||(e instanceof Error&&!c))my.err='La proposition n’était pas exploitable. Tu peux relancer une proposition.';
     else{sampleFn=null;my.err='Cette fonction n’est pas disponible ici.'}
   }
   my.busy=false;if(ai===my&&!$('#sheet').hidden)aiSheet();if(!sampleFn)render();
 },
 aiadd(){if(!ai||!ai.result)return;const r=ai.result;
   S.custom.push({id:'c'+Date.now().toString(36),custom:true,ai:true,name:r.name,type:r.type,time:r.time,items:r.items,steps:r.steps});
   ai=null;closeSheet();recType='all';commit();toast('Recette ajoutée à tes recettes')}
};
function onClick(ev){const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=ACT[el.dataset.act];if(f)f(el)}
function onChange(ev){const t=ev.target,p=S.prof,pe=p.people[editP]||p.people[0];
  if(t.dataset.act==='got'){ACT.got(t);return}
  if(t.id&&t.id.startsWith('obn-')){const pe=p.people[+t.id.slice(4)];if(pe)pe.name=t.value.trim().slice(0,24)||pe.name;quiet();return}
  if(t.id==='budget'){const v=Number(t.value);if(v>=10&&v<=2000){p.budget=v;stale();if(tab==='onb'){quiet();rebuild()}else commit()}else{toast('Budget entre 10 et 2 000 €');render()}return}
  if(t.id&&t.id.startsWith('dk-')){const k=pe.dukan,m={'dk-phase':()=>k.phase=t.value,'dk-end':()=>k.attackEnd=t.value,'dk-rhythm':()=>k.rhythm=Number(t.value),'dk-first':()=>k.first=t.value,'dk-start':()=>k.cycleStart=t.value,'dk-conso':()=>k.conso=Number(t.value),'dk-ppday':()=>k.ppDay=Number(t.value)};if(m[t.id])m[t.id]();stale();commit();return}
  if(t.id==='pname'){pe.name=t.value.trim().slice(0,24)||pe.name;quiet();if(tab!=='me')render();return}
  if(t.id==='appetite'){pe.appetite=t.value;stale();commit();return}
  if(t.id==='diet'){pe.diet=t.value;stale();commit();return}
  if(t.id==='maxTime'){p.maxTime=Number(t.value);stale();commit();return}
  if(t.id==='leftovers'){p.leftovers=t.checked;stale();commit();return}
  if(t.id==='gf'||t.id==='lf'){pe[t.id]=t.checked;stale();commit();return}
  if(t.dataset.meal){p.meals[t.dataset.meal]=t.checked;if(!Object.values(p.meals).some(Boolean)){p.meals.d=true;toast('Garde au moins un repas par jour')}stale();commit();return}
  if(t.id==='photo-in'){const f=t.files&&t.files[0];if(f)photoUpload(t.dataset.rid,f);t.value='';return}
  if(t.id==='calt'){S.cal=t.checked;commit();return}
  if(t.id==='tg'){const tp=trackPerson(),v=Number(t.value);tp.goal=t.value!==''&&v>=20&&v<=400?v:null;commit();return}
  if(t.id==='d-type'||t.id==='d-pick'){readDraft();recForm()}
}
function onInput(ev){if(ev.target.id==='rq'){recQuery=ev.target.value;paintRecipeList()}}
function onOver(ev){const h=ev.target.closest&&ev.target.closest('.hit');if(h)showTip(h);else if(ev.type==='pointerout'&&ev.target.closest&&ev.target.closest('.chartbox'))hideTip()}

/* ---------- démarrage ---------- */
async function boot(){
  document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);
  document.addEventListener('pointerover',onOver);document.addEventListener('pointerout',onOver);document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('hit'))showTip(e.target)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(cook)ACT.ckclose();else if(!$('#sheet').hidden)closeSheet()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cook){wl=null;wake()}});
  const local=readLocal();
  if(local){S=normalize(local);S.savedAt=local.savedAt||0;rebuild();render()}
  await connect();
  const firstVisit=!S;
  if(!S){S=defaults();S.savedAt=Date.now();rebuild();writeLocal()}
  if(!S.onboarded){tab='onb';ob=0}
  const nowWeek=mondayOf(iso(new Date()));
  if(nowWeek>S.week&&!S.plans[S.week])S.week=nowWeek;
  rebuild();booted=true;render();if(!firstVisit)flush();
}
function nativeBars(){
  try{const sb=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(!sb)return;
    const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    sb.setOverlaysWebView({overlay:false}).catch(()=>{});sb.setBackgroundColor({color:dark?'#0E1512':'#F2F5F1'}).catch(()=>{});sb.setStyle({style:dark?'LIGHT':'DARK'}).catch(()=>{});
  }catch{}
}
if(!globalThis.__TEST__){nativeBars();boot()}
