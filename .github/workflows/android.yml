name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Respecter la barre d'état et la barre de navigation
        run: |
          cat > android/app/src/main/java/fr/kevyn/atable/MainActivity.java <<'JAVA'
          package fr.kevyn.atable;

          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              boolean dark = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
              View root = findViewById(android.R.id.content);
              root.setBackgroundColor(Color.parseColor(dark ? "#0E1512" : "#F2F5F1"));
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets i = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout() | WindowInsetsCompat.Type.ime());
                v.setPadding(i.left, i.top, i.right, i.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
              WindowInsetsControllerCompat c = new WindowInsetsControllerCompat(getWindow(), root);
              c.setAppearanceLightStatusBars(!dark);
              c.setAppearanceLightNavigationBars(!dark);
            }
          }
          JAVA
      - name: Générer l'icône
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B6B55' --iconBackgroundColorDark '#1B6B55' || echo "Icône par défaut conservée"
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk a-table.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest a-table.apk --title "À table (APK)" --notes "APK de test, signé en mode debug."
      - uses: actions/upload-artifact@v4
        with:
          name: a-table-apk
          path: a-table.apk
