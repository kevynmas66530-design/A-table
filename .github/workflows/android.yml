name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Générer l'icône
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B6B55' --iconBackgroundColorDark '#1B6B55' || echo "Icône par défaut conservée"
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk a-table.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest a-table.apk --title "À table (APK)" --notes "APK de test, signé en mode debug."
      - uses: actions/upload-artifact@v4
        with:
          name: a-table-apk
          path: a-table.apk
